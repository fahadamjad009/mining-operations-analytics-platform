name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import
        run: |
          python -c "from src.miningops.config import settings; print('ok', settings.project_root)"

      - name: Run tests (if present)
        shell: bash
        run: |
          set -e

          # If there is no tests/ folder or it has no test files,
          # pytest exits with code 5 ("no tests collected"). We skip in that case.
          if [ -d "tests" ] && compgen -G "tests/test*.py" > /dev/null; then
            pytest -q
          else
            echo "No tests found (skipping pytest)."
          fi