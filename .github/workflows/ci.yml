name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import
        shell: bash
        run: |
          set -e
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -c "import src.miningops; print('import ok')"

      - name: Run tests (treat 'no tests collected' as success)
        shell: bash
        run: |
          set +e
          pytest -q
          code=$?
          echo "pytest exit code: $code"

          # 0 = tests passed
          # 5 = no tests collected (common early in MVP repos)
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi

          exit "$code"